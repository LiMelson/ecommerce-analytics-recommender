name: Project checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-ephemeral-only
          MYSQL_DATABASE: commerce_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-mysql-ephemeral-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.37.168
        env:
          CLICKHOUSE_DB: commerce_ci
          CLICKHOUSE_USER: commerce
          CLICKHOUSE_PASSWORD: ci-clickhouse-ephemeral-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
        ports: ['8123:8123']
        options: >-
          --health-cmd="clickhouse-client --user commerce --password ci-clickhouse-ephemeral-only --query 'SELECT 1'"
          --health-interval=10s --health-timeout=5s --health-retries=15
          --memory=3g --cpus=2
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-mysql-ephemeral-only
      MYSQL_DATABASE: commerce_ci
      CLICKHOUSE_HOST: 127.0.0.1
      CLICKHOUSE_USER: commerce
      CLICKHOUSE_PASSWORD: ci-clickhouse-ephemeral-only
      CLICKHOUSE_DATABASE: commerce_ci
      RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m app.cli init
      - run: ruff check app tests migrations
      - run: ruff format --check app tests migrations
      - run: python -m pytest -q
