name: data-algo

on:
  pull_request:
    paths:
      - "data_algo/**"
      - "backend/app/importing.py"
      - "docs/数据与算法交付约定.md"
      - ".github/workflows/data-algo.yml"
  push:
    branches: [main]
    paths:
      - "data_algo/**"
      - "backend/app/importing.py"
      - ".github/workflows/data-algo.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_algo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data_algo tests
        run: python -m pytest -q
