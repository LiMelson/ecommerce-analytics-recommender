name: commerce-insights
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.37.168
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-commerce_insights}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-commerce}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?请先运行 backend 初始化配置命令}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-limits.xml:/etc/clickhouse-server/config.d/project-limits.xml:ro
    mem_limit: 3g
    cpus: 2
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  clickhouse_data:
